[project]
name = "supportflow"
version = "0.1.0"
description = "Chat de soporte con Streamlit y recepción validada con FastAPI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "azure-identity>=1.25,<2",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "openai>=2.54,<3",
    "pydantic-settings>=2.13,<3",
    "streamlit>=1.63,<2",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
